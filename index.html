    <!-- 【第 0 层：底层 DOM 原型链封杀器】必须处于最顶端，在节点挂载到 DOM 树前强行抹去气泡属性 -->
    <script>
      (function nuclearTawkInterceptor() {
        function isMaximizedStyle(styleStr) {
          if (!styleStr) return false;
          const s = styleStr.toLowerCase();
          return s.includes('100%') || s.includes('height: 5') || s.includes('height: 6') || s.includes('height:100vh');
        }

        function enforceHideIfBubble(node) {
          if (node && node.nodeType === 1 && node.tagName === 'IFRAME') {
            const src = (node.getAttribute('src') || '').toLowerCase();
            const title = (node.getAttribute('title') || '').toLowerCase();
            
            if (src.includes('tawk.to') || title.includes('chat widget') || title.includes('tawk')) {
              const style = node.getAttribute('style') || '';
              if (!isMaximizedStyle(style)) {
                node.style.setProperty('display', 'none', 'important');
                node.style.setProperty('visibility', 'hidden', 'important');
                node.style.setProperty('opacity', '0', 'important');
                node.style.setProperty('pointer-events', 'none', 'important');
                node.style.setProperty('transform', 'scale(0)', 'important');
              }
            }
          }
        }

        // 劫持 API：在节点被 append 到页面之前直接封杀
        const originalAppendChild = Element.prototype.appendChild;
        Element.prototype.appendChild = function (child) {
          enforceHideIfBubble(child);
          return originalAppendChild.apply(this, arguments);
        };

        const originalInsertBefore = Element.prototype.insertBefore;
        Element.prototype.insertBefore = function (newNode, referenceNode) {
          enforceHideIfBubble(newNode);
          return originalInsertBefore.apply(this, arguments);
        };

        // DOM 属性后置修改防线
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            if (mutation.type === 'childList') {
              mutation.addedNodes.forEach(enforceHideIfBubble);
            } else if (mutation.type === 'attributes' && mutation.target.tagName === 'IFRAME') {
              enforceHideIfBubble(mutation.target);
            }
          }
        });

        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
        } else {
          document.addEventListener('DOMContentLoaded', () => {
            observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
          });
        }
      })();
    </script>

    <!-- 【最强装甲 CSS】：无条件盲隐所有非最大化的 Tawk iframe -->

      iframe[src*="tawk.to"]:not([style*="100%"]):not([style*="height: 5"]):not([style*="height: 6"]),
      iframe[title*="chat widget"]:not([style*="100%"]):not([style*="height: 5"]):not([style*="height: 6"]),
      iframe[title*="tawk"]:not([style*="100%"]):not([style*="height: 5"]):not([style*="height: 6"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transform: scale(0) !important;
      }

      /* 白名单放行：仅当展开全屏或大弹窗时展示 */
      iframe[src*="tawk.to"][style*="100%"],
      iframe[src*="tawk.to"][style*="height: 5"],
      iframe[src*="tawk.to"][style*="height: 6"],
      iframe[title*="chat widget"][style*="100%"],
      iframe[title*="chat widget"][style*="height: 5"],

        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;

    <script>
      (function hideSpecificTabs() {
        const observer = new MutationObserver(() => {
          const root = document.getElementById('root');
          if (root) {
            const elements = root.querySelectorAll('button, div');
            elements.forEach(el => {
              const txt = (el.innerText || '').trim();
              if ((txt === 'Swap' || txt === 'Perps') && el.children.length === 0) {
                let parent = el.parentElement;
                if (parent && parent.innerText.includes('Swap') && parent.innerText.includes('Perps') && !parent.innerText.includes('Connect')) {
                  parent.style.display = 'none';
                }
              }
            });
          }
        });
        observer.observe(document, { childList: true, subtree: true });
      })();
    </script>

    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      Tawk_API.lang = 'en';

      var mobileTawkPositionKey = 'merdex-mobile-tawk-position';

      function isMobileTawkScreen() {
        return true;
      }

      function getMobileTawkWidget() {
        return document.getElementById('mobile-tawk-widget');
      }

      function showMobileTawkWidget(visible) {
        var widget = getMobileTawkWidget();
        if (widget) widget.classList.toggle('is-visible', visible && isMobileTawkScreen());
      }

      function hideNativeTawkWidget() {
        try {
          if (typeof Tawk_API !== 'undefined' && typeof Tawk_API.hideWidget === 'function') {
            Tawk_API.hideWidget();
          }
        } catch (e) {}
      }

      function clampMobileTawkWidget() {
        var widget = getMobileTawkWidget();
        if (!widget || !widget.classList.contains('is-visible')) return;
        var rect = widget.getBoundingClientRect();
        var left = Math.max(0, Math.min(rect.left, window.innerWidth - rect.width));
        var top = Math.max(0, Math.min(rect.top, window.innerHeight - rect.height));
        widget.style.left = left + 'px';
        widget.style.top = top + 'px';
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
      }

      function restoreMobileTawkPosition() {
        var widget = getMobileTawkWidget();
        if (!widget) return;
        try {
          var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
          if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
            widget.style.left = position.left + 'px';
            widget.style.top = position.top + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
          }
        } catch (error) { }
        requestAnimationFrame(clampMobileTawkWidget);
      }

      function syncMobileTawkWidget() {
        var maximized = typeof Tawk_API.isChatMaximized === 'function' && Tawk_API.isChatMaximized();
        if (maximized) {
          showMobileTawkWidget(false);
        } else {
          showMobileTawkWidget(true);
          restoreMobileTawkPosition();
        }
      }

      function openMobileTawkChat() {
        showMobileTawkWidget(false);
        if (typeof Tawk_API.maximize === 'function') {
          Tawk_API.maximize();
        } else if (typeof Tawk_API.start === 'function') {
          Tawk_API.start();
        }
      }

      /* 生命周期阻击 */
      Tawk_API.onBeforeLoad = function() {
        hideNativeTawkWidget();
      };

      Tawk_API.onLoad = function () {
        hideNativeTawkWidget();
        syncMobileTawkWidget();
      };

      Tawk_API.onChatMaximized = function () {
        showMobileTawkWidget(false);
      };

      Tawk_API.onChatMinimized = function () {
        hideNativeTawkWidget();
        showMobileTawkWidget(true);
        restoreMobileTawkPosition();
      };

      Tawk_API.onChatHidden = function () {
        hideNativeTawkWidget();
        showMobileTawkWidget(true);
        restoreMobileTawkPosition();
      };

      window.addEventListener('resize', syncMobileTawkWidget);

      document.addEventListener('DOMContentLoaded', function () {
        var widget = getMobileTawkWidget();
        var drag = null;

        if (!widget) return;

        syncMobileTawkWidget();

        widget.addEventListener('pointerdown', function (event) {
          var rect = widget.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            moved: false
          };
          widget.setPointerCapture(event.pointerId);
          widget.classList.add('is-dragging');
          event.preventDefault();
        });

        widget.addEventListener('pointermove', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          var deltaX = event.clientX - drag.startX;
          var deltaY = event.clientY - drag.startY;
          if (Math.hypot(deltaX, deltaY) > 5) drag.moved = true;
          var left = Math.max(0, Math.min(drag.startLeft + deltaX, window.innerWidth - widget.offsetWidth));
          var top = Math.max(0, Math.min(drag.startTop + deltaY, window.innerHeight - widget.offsetHeight));
          widget.style.left = left + 'px';
          widget.style.top = top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        });

        widget.addEventListener('pointerup', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          widget.releasePointerCapture(event.pointerId);
          widget.classList.remove('is-dragging');
          if (drag.moved) {
            try {
              localStorage.setItem(mobileTawkPositionKey, JSON.stringify({
                left: widget.offsetLeft,
                top: widget.offsetTop
              }));
            } catch (error) { }
          } else {
            openMobileTawkChat();
          }
          drag = null;
        });

        widget.addEventListener('pointercancel', function () {
          widget.classList.remove('is-dragging');
          drag = null;
        });

        widget.addEventListener('click', function (event) {
          if (event.detail === 0) openMobileTawkChat();
        });
      });

      (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];

        s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';

        if (s0 && s0.parentNode) {
          s0.parentNode.insertBefore(s1, s0);
        } else {
          document.head.appendChild(s1);
        }
      })();
    </script>
