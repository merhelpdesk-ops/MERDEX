<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style id="tawk-anti-flicker-style">
      body:not(.tawk-chat-open) iframe[src*="tawk.to"],
      body:not(.tawk-chat-open) iframe[title*="chat"],
      body:not(.tawk-chat-open) div[id^="tawk"],
      body:not(.tawk-chat-open) div[class*="tawk"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transform: translate3d(-9999px, -9999px, 0) !important;
      }

      body.tawk-chat-open iframe[src*="tawk.to"],
      body.tawk-chat-open iframe[title*="chat"] {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        transform: none !important;
      }
    </style>

    <!-- 2. 规范 URL -->
    <link rel="canonical" href="https://www.mer.finance/" />

    <meta property="og:site_name" content="MERDEX" />
    <meta property="og:title" content="MERDEX | Aggregate DEX & Perpetual Trading Platform" />
    <meta property="og:description" content="MERDEX provides decentralized exchange transactions and cryptocurrency contracts and derivatives transactions." />

    <!-- 5. Schema.org JSON-LD 结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialProduct",
      "name": "MERDEX",
      "url": "https://www.mer.finance",
      "logo": "https://www.mer.finance/MERDEX_Poster.png",

    }
    </script>

    <style>
      :root {
        --bg-main: #0d0e12;
        --bg-nav: rgba(13, 14, 18, 0.85);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-active: #38bdf8;
        --text-inactive: #94a3b8;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      .merdex-mobile-top-bar {
        display: none;
      }

      .merdex-nav-header {
        display: flex;
        align-items: center;
        background-color: #0d0e12;
        border-bottom: 1px solid #1e2330;
        height: 52px;
        padding: 0 16px;
        box-sizing: border-box;
        overflow-x: auto;
        white-space: nowrap;
      }

      .merdex-nav-header::-webkit-scrollbar {
        display: none;
      }

      .merdex-logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 20px;
        text-decoration: none;
        flex-shrink: 0;
        height: 38px;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .merdex-logo-container:hover {
        opacity: 0.85;
        transform: scale(1.02);
      }

      .merdex-logo-img {
        height: 100%;
        width: auto;
        max-width: 150px;
        object-fit: contain;
        display: block;
      }

      .merdex-nav-links {
        display: flex;
        align-items: center;
        gap: 16px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .merdex-nav-item a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 14px 0;
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .merdex-nav-item a:hover,
      .merdex-nav-item.active a {
        color: #ffffff;
      }

      .nav-icon {
        display: none;
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .green-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        display: inline-block;
      }

      @media (max-width: 768px) {
        body {
          padding-top: 52px !important;
          padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
        }

        #root {
          padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
          box-sizing: border-box;
        }

        .merdex-mobile-top-bar {
          display: flex;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 48px;
          background: rgba(13, 14, 18, 0.95);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border-color);
          z-index: 9998;
          padding: 0 16px;
          align-items: center;
          justify-content: flex-start;
        }

        .merdex-mobile-top-bar .merdex-logo-container {
          margin-right: 0;
          height: 30px;
        }

        .merdex-mobile-top-bar .merdex-logo-img {
          max-width: 120px;
        }

        .merdex-nav-header {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          top: auto;
          height: calc(60px + env(safe-area-inset-bottom, 0px));
          padding: 6px 12px env(safe-area-inset-bottom, 0px) 12px;
          background: var(--bg-nav);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border-top: 1px solid var(--border-color);
          border-bottom: none;
          z-index: 9999;
          justify-content: space-around;
          box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .merdex-nav-header .merdex-logo-container {
          display: none;
        }

        .merdex-nav-links {
          width: 100%;
          justify-content: space-between;
          gap: 4px;
        }

        .merdex-nav-item {
          flex: 1;
        }

        .merdex-nav-item a {
          flex-direction: column;
          gap: 3px;
          padding: 6px 0;
          font-size: 11px;
          font-weight: 600;
          justify-content: center;
          border-radius: 8px;
          transition: all 0.15s ease-in-out;
          color: var(--text-inactive);
        }

        .merdex-nav-item a:active {
          transform: scale(0.92);
        }

        .merdex-nav-item.active a {
          color: var(--text-active);
          background: rgba(56, 189, 248, 0.08);
        }

        .nav-icon {
          display: block;
          transition: transform 0.2s ease;
        }

        .merdex-nav-item.active .nav-icon {
          transform: translateY(-1px);
        }

        .icon-wrapper {
          position: relative;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .green-dot {
          position: absolute;
          top: -1px;
          right: -3px;
          box-shadow: 0 0 6px #10b981;
        }
      }

      #mobile-tawk-widget {
        display: none;
      }

      #mobile-tawk-widget.is-visible {
        align-items: center;
        background: #1595ad;
        border: 0;
        border-radius: 50%;
        bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 5px 18px rgba(21, 149, 173, 0.4);
        color: #fff;
        cursor: grab;
        display: flex;
        height: 44px;
        justify-content: center;
        padding: 0;
        position: fixed;
        right: 16px;
        touch-action: none;
        user-select: none;
        width: 44px;
        z-index: 2000000001;
        transition: transform 0.15s ease, opacity 0.2s ease;
        pointer-events: auto !important;
      }

      #mobile-tawk-widget.is-dragging {
        cursor: grabbing;
        transform: scale(0.96);
      }

      @media (min-width: 1001px) {
        #mobile-tawk-widget.is-visible {
          bottom: 30px;
          right: 20px;
        }
      }
    </style>

    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      Tawk_API.lang = 'en';

      var mobileTawkPositionKey = 'merdex-mobile-tawk-position';
      var tawkReady = false;
      var tawkOpenRetries = 0;
      var TAWK_DIRECT_LINK = 'https://tawk.to/chat/6a98b268451e133447599dcc/1k1l6h0rv';

      function getMobileTawkWidget() {
        return document.getElementById('mobile-tawk-widget');
      }

      function showMobileTawkWidget(visible) {
        var widget = getMobileTawkWidget();
        if (widget) widget.classList.toggle('is-visible', visible);
      }

      function restoreMobileTawkPosition() {
        var widget = getMobileTawkWidget();
        if (!widget) return;
        try {
          var position = JSON.parse(localStorage.getItem(mobileTawkPositionKey));
          if (position && Number.isFinite(position.left) && Number.isFinite(position.top)) {
            var maxLeft = Math.max(0, window.innerWidth - 50);
            var maxTop = Math.max(0, window.innerHeight - 50);
            widget.style.left = Math.min(position.left, maxLeft) + 'px';
            widget.style.top = Math.min(position.top, maxTop) + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
          }
        } catch (error) { }
      }

      function backToCustomBubble() {
        document.body.classList.remove('tawk-chat-open');
        showMobileTawkWidget(true);
        restoreMobileTawkPosition();

        try {
          if (typeof Tawk_API.hideWidget === 'function') {
            Tawk_API.hideWidget();
          }
        } catch (e) {}
      }

      function openMobileTawkChat() {
        if (!tawkReady) {
          if (++tawkOpenRetries < 50) {
            setTimeout(openMobileTawkChat, 300);
          } else {
            tawkOpenRetries = 0;
            window.open(TAWK_DIRECT_LINK, '_blank');
          }
          return;
        }
        tawkOpenRetries = 0;

        document.body.classList.add('tawk-chat-open');
        showMobileTawkWidget(false);

        try {
          if (typeof Tawk_API.showWidget === 'function') Tawk_API.showWidget();
          if (typeof Tawk_API.start === 'function') Tawk_API.start();
          if (typeof Tawk_API.maximize === 'function') Tawk_API.maximize();
          else if (typeof Tawk_API.toggle === 'function') Tawk_API.toggle();
        } catch (e) {}

        setTimeout(function () {
          try {
            if (typeof Tawk_API.isChatMaximized === 'function'
                && !Tawk_API.isChatMaximized()
                && typeof Tawk_API.toggle === 'function') {
              Tawk_API.toggle();
            }
          } catch (e) {}
        }, 400);
      }

      Tawk_API.onLoad = function () {
        tawkReady = true;
        if (Tawk_API.isChatMaximized && Tawk_API.isChatMaximized()) {
          document.body.classList.add('tawk-chat-open');
          showMobileTawkWidget(false);
          if (typeof Tawk_API.showWidget === 'function') Tawk_API.showWidget();
        } else {
          backToCustomBubble();
        }
      };

      Tawk_API.onChatMaximized = function () {
        document.body.classList.add('tawk-chat-open');
        showMobileTawkWidget(false);
      };

      Tawk_API.onChatMinimized = backToCustomBubble;

      document.addEventListener('DOMContentLoaded', function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        s1.onerror = function () {
          window.open(TAWK_DIRECT_LINK, '_blank');
        };
        if (s0 && s0.parentNode) {
          s0.parentNode.insertBefore(s1, s0);
        } else {
          document.head.appendChild(s1);
        }

        var widget = getMobileTawkWidget();
        var drag = null;

        if (!widget) return;

        showMobileTawkWidget(true);
        restoreMobileTawkPosition();

        widget.addEventListener('pointerdown', function (event) {
          var rect = widget.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            moved: false
          };
          widget.setPointerCapture(event.pointerId);
          widget.classList.add('is-dragging');
        });

        widget.addEventListener('pointermove', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          var deltaX = event.clientX - drag.startX;
          var deltaY = event.clientY - drag.startY;
          if (Math.hypot(deltaX, deltaY) > 5) drag.moved = true;
          var left = Math.max(0, Math.min(drag.startLeft + deltaX, window.innerWidth - widget.offsetWidth));
          var top = Math.max(0, Math.min(drag.startTop + deltaY, window.innerHeight - widget.offsetHeight));
          widget.style.left = left + 'px';
          widget.style.top = top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        });

        widget.addEventListener('pointerup', function (event) {
          if (!drag || drag.pointerId !== event.pointerId) return;
          widget.releasePointerCapture(event.pointerId);
          widget.classList.remove('is-dragging');
          if (drag.moved) {
            try {
              localStorage.setItem(mobileTawkPositionKey, JSON.stringify({
                left: widget.offsetLeft,
                top: widget.offsetTop
              }));
            } catch (error) { }
          } else {
            openMobileTawkChat();
          }
          drag = null;
        });

        widget.addEventListener('pointercancel', function () {
          widget.classList.remove('is-dragging');
          drag = null;
        });
      });
    </script>
  </head>
