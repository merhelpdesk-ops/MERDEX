    <!-- 1. 超强 UI 劫持与零闪烁拦截脚本 -->
    <script>
      (function interceptTawkUI() {
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === 1 && node.tagName === 'IFRAME') {
                const src = node.getAttribute('src') || '';
                const title = node.getAttribute('title') || '';
                
                // 判断是否是小气泡图标 (Widget Bubble)
                const isTawkBubble = 
                  (src.includes('about:blank') || title.toLowerCase().includes('chat widget')) &&
                  !node.classList.contains('custom-tawk-chat-iframe');

                if (isTawkBubble) {
                  // 强制隐藏原生气泡，后台静默运行
                  node.style.setProperty('display', 'none', 'important');
                  node.style.setProperty('visibility', 'hidden', 'important');
                  node.style.setProperty('opacity', '0', 'important');
                  node.style.setProperty('pointer-events', 'none', 'important');
                  node.style.setProperty('transform', 'scale(0)', 'important');
                }
              }
            }
          }
        });

        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <style>
      :root {

      }

      .merdex-nav-links {

        margin: 0;
        padding: 0;

      .green-dot {

          right: -3px;

      /* ---------------------------------------------------- */
      /* 2. 重写自定义 UI 样式 (悬浮球 + 窗口容器适配)          */
      /* ---------------------------------------------------- */

      /* 隐藏原生气泡 */
      iframe[src="about:blank"][referrerpolicy="no-referrer-when-downgrade"],
      iframe[title*="chat widget"]:not([style*="max-height:100%"]):not([style*="height: 100%"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* 自定义悬浮球 (MERDEX 赛博暗黑风) */
      #custom-chat-trigger {
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        box-shadow: 0 8px 24px rgba(0, 242, 254, 0.35), inset 0 0 10px rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        z-index: 2000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
        touch-action: none;
        user-select: none;
      }

      #custom-chat-trigger:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
      }

      #custom-chat-trigger:active, #custom-chat-trigger.is-dragging {
        transform: scale(0.92);
      }

      #custom-chat-trigger svg {
        width: 26px;
        height: 26px;
        fill: #0d0e12;
      }

      /* 未读红点提醒 */
      .chat-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 12px;
        height: 12px;
        background-color: #ef4444;
        border: 2px solid #0d0e12;
        border-radius: 50%;
        display: none;
      }
      .chat-badge.active { display: block; }

      /* Tawk 真实聊天窗口的外层容器改造 */
      body > iframe[title*="chat widget"][style*="height: 100%"],
      body > iframe[title*="chat widget"][style*="max-height: 100%"] {
        border-radius: 16px !important;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.2) !important;
        overflow: hidden !important;
        transition: all 0.3s ease !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
      }

      @media (max-width: 768px) {
        #custom-chat-trigger {
          bottom: calc(76px + env(safe-area-inset-bottom, 0px));
          right: 16px;
          width: 48px;
          height: 48px;
        }

        body > iframe[title*="chat widget"][style*="height: 100%"],
        body > iframe[title*="chat widget"][style*="max-height: 100%"] {
          bottom: calc(65px + env(safe-area-inset-bottom, 0px)) !important;
          right: 0 !important;
          left: 0 !important;
          width: 100vw !important;
          height: calc(100vh - 120px) !important;
          border-radius: 20px 20px 0 0 !important;
        }
      }

    <!-- 3. Tawk.to JavaScript API 控制交互逻辑与穿透样式注入 -->
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      Tawk_API.lang = 'en';

      Tawk_API.autoStart = true;

      function getCustomWidget() {
        return document.getElementById('custom-chat-trigger');
      }

      function updateBadge(unreadCount) {
        var badge = document.getElementById('chat-unread-badge');
        if (badge) {
          if (unreadCount > 0) {
            badge.classList.add('active');
          } else {
            badge.classList.remove('active');
          }
        }
      }

      /* 穿透 DOM 向 iframe 内部注入暗黑样式 */
      function injectInternalStyles() {
        const iframes = document.querySelectorAll('iframe');
        iframes.forEach((iframe) => {
          try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            if (iframeDoc && !iframeDoc.getElementById('custom-tawk-dark-style')) {
              const style = iframeDoc.createElement('style');
              style.id = 'custom-tawk-dark-style';
              style.textContent = `
                /* 顶栏背景色修正为暗黑风 */
                header, .tawk-header-container, [class*="header"] {
                  background: #161b22 !important;
                  color: #ffffff !important;
                }
                /* 主体聊天区域背景及文字颜色 */
                body, html, .tawk-body-container, [class*="chat-window"], [class*="card"] {
                  background-color: #0d0e12 !important;
                  color: #e2e8f0 !important;
                }
                /* 底部输入框区域暗黑化 */
                footer, .tawk-footer-container, [class*="footer"], textarea, input {
                  background-color: #161b22 !important;
                  color: #ffffff !important;
                  border-color: rgba(255, 255, 255, 0.1) !important;
                }
                /* 系统图标与按钮反色调整 */
                button, svg {
                  fill: #38bdf8 !important;
                }
              `;
              iframeDoc.head.appendChild(style);
            }
          } catch (e) {
            // 受浏览器同源策略 (Same-Origin Policy) 保护时捕获异常
          }
        });
      }

      /* Tawk 生命周期与自定义事件响应 */
      Tawk_API.onLoad = function () {
        if (typeof Tawk_API.hideWidget === 'function') {
          Tawk_API.hideWidget();
        }
        // 定时轮询确保新生成的 iframe 渲染时能成功被注入 CSS
        setInterval(injectInternalStyles, 1000);
      };

      Tawk_API.onChatMaximized = function () {
        var widget = getCustomWidget();
        if (widget) widget.style.display = 'none';
        updateBadge(0);
        injectInternalStyles();
      };

      Tawk_API.onChatMinimized = function () {
        if (typeof Tawk_API.hideWidget === 'function') {
          Tawk_API.hideWidget();
        }
        var widget = getCustomWidget();
        if (widget) widget.style.display = 'flex';
      };

      Tawk_API.onUnreadCountChanged = function(count) {
        updateBadge(count);
      };

      function toggleCustomChat() {
        if (typeof Tawk_API.isChatMaximized === 'function' && Tawk_API.isChatMaximized()) {
          Tawk_API.minimize();
        } else {
          Tawk_API.maximize();
        }
      }

      // 初始化自定义悬浮按钮手势 drag 拖拽逻辑 (兼容 PC/Touch)
      document.addEventListener('DOMContentLoaded', function () {
        var widget = getCustomWidget();
        if (!widget) return;

        var drag = null;

        widget.addEventListener('pointerdown', function (e) {
          var rect = widget.getBoundingClientRect();
          drag = {
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            startLeft: rect.left,
            startTop: rect.top,
            moved: false
          };
          widget.setPointerCapture(e.pointerId);
          widget.classList.add('is-dragging');
        });

        widget.addEventListener('pointermove', function (e) {
          if (!drag || drag.pointerId !== e.pointerId) return;
          var dx = e.clientX - drag.startX;
          var dy = e.clientY - drag.startY;
          if (Math.hypot(dx, dy) > 5) drag.moved = true;

          var left = Math.max(10, Math.min(drag.startLeft + dx, window.innerWidth - widget.offsetWidth - 10));
          var top = Math.max(10, Math.min(drag.startTop + dy, window.innerHeight - widget.offsetHeight - 10));

          widget.style.left = left + 'px';
          widget.style.top = top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        });

        widget.addEventListener('pointerup', function (e) {
          if (!drag || drag.pointerId !== e.pointerId) return;
          widget.releasePointerCapture(e.pointerId);
          widget.classList.remove('is-dragging');

          if (!drag.moved) {
            toggleCustomChat();
          }
          drag = null;
        });

        widget.addEventListener('pointercancel', function () {
          if (widget) widget.classList.remove('is-dragging');
          drag = null;
        });
      });

      // 加载 Tawk 脚本
      (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        if (s0 && s0.parentNode) {
          s0.parentNode.insertBefore(s1, s0);
        } else {
          document.head.appendChild(s1);
        }
      })();
    </script>
