    <!-- 1. 彻底拦截并隐藏 Tawk.to 原生所有 IFRAME 界面 -->
    <script>
      (function hideAllTawkIframes() {
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === 1 && node.tagName === 'IFRAME') {
                // 彻底隐藏原生界面，仅留后台通道
                node.style.setProperty('display', 'none', 'important');
                node.style.setProperty('visibility', 'hidden', 'important');
                node.style.setProperty('opacity', '0', 'important');
                node.style.setProperty('pointer-events', 'none', 'important');
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>

    <title>MERDEX</title>
    <meta name="description" content="MERDEX is a secure and high-speed aggregate platform." />
    <link rel="canonical" href="https://mer.finance/" />

    <style>
      :root {
        --bg-main: #0d0e12;
        --bg-nav: rgba(13, 14, 18, 0.85);
        --bg-card: #161b22;
        --border-color: rgba(255, 255, 255, 0.08);
        --text-active: #38bdf8;
        --text-inactive: #94a3b8;
        --accent-cyan: #00f2fe;
        --accent-blue: #4facfe;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      .merdex-mobile-top-bar { display: none; }

      .merdex-nav-header {
        display: flex;
        align-items: center;
        background-color: #0d0e12;
        border-bottom: 1px solid #1e2330;
        height: 52px;
        padding: 0 16px;
        box-sizing: border-box;
        overflow-x: auto;
        white-space: nowrap;
      }

      .merdex-nav-header::-webkit-scrollbar { display: none; }

      .merdex-logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 20px;
        text-decoration: none;
        flex-shrink: 0;
        height: 38px;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .merdex-logo-container:hover {
        opacity: 0.85;
        transform: scale(1.02);
      }

      .merdex-logo-img {
        height: 100%;
        width: auto;
        max-width: 150px;
        object-fit: contain;
        display: block;
      }

      .merdex-nav-links {
        display: flex;
        align-items: center;
        gap: 16px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .merdex-nav-item a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 14px 0;
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .merdex-nav-item a:hover,
      .merdex-nav-item.active a { color: #ffffff; }

      .nav-icon {
        display: none;
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .green-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        display: inline-block;
      }

      /* ---------------------------------------------------- */
      /* 自定义悬浮球 + 自建 MERDEX 赛博暗黑风格客服面板     */
      /* ---------------------------------------------------- */

      #custom-chat-trigger {
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        box-shadow: 0 8px 24px rgba(0, 242, 254, 0.35), inset 0 0 10px rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        z-index: 2000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
        touch-action: none;
        user-select: none;
      }

      #custom-chat-trigger:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 30px rgba(0, 242, 254, 0.5);
      }

      #custom-chat-trigger:active, #custom-chat-trigger.is-dragging {
        transform: scale(0.92);
      }

      #custom-chat-trigger svg {
        width: 26px;
        height: 26px;
        fill: #0d0e12;
      }

      .chat-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 12px;
        height: 12px;
        background-color: #ef4444;
        border: 2px solid #0d0e12;
        border-radius: 50%;
        display: none;
      }
      .chat-badge.active { display: block; }

      /* 自建暗黑 UI 聊天主窗口 */
      #merdex-chat-window {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 380px;
        height: 540px;
        background: #0d0e12;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 242, 254, 0.15);
        z-index: 2000001;
        display: none;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      #merdex-chat-window.open {
        display: flex;
        animation: chatFadeIn 0.25s ease-out forwards;
      }

      @keyframes chatFadeIn {
        from { opacity: 0; transform: translateY(15px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* 头部 */
      .chat-header {
        padding: 16px;
        background: #161b22;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-header-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chat-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #0d0e12;
        font-size: 14px;
      }

      .chat-title-text {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
      }

      .chat-status {
        font-size: 11px;
        color: #10b981;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .close-chat-btn {
        background: transparent;
        border: none;
        color: var(--text-inactive);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        transition: color 0.2s;
      }
      .close-chat-btn:hover { color: #ffffff; }

      /* 消息区域 */
      .chat-messages {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat-messages::-webkit-scrollbar { width: 4px; }
      .chat-messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

      .msg-row {
        display: flex;
        flex-direction: column;
        max-width: 80%;
      }

      .msg-row.user {
        align-self: flex-end;
        align-items: flex-end;
      }

      .msg-row.agent {
        align-self: flex-start;
        align-items: flex-start;
      }

      .msg-bubble {
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }

      .msg-row.user .msg-bubble {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #0d0e12;
        font-weight: 500;
        border-bottom-right-radius: 2px;
      }

      .msg-row.agent .msg-bubble {
        background: #1e2330;
        color: #e2e8f0;
        border-bottom-left-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .msg-time {
        font-size: 10px;
        color: var(--text-inactive);
        margin-top: 4px;
      }

      /* 底部输入框 */
      .chat-input-area {
        padding: 12px 16px;
        background: #161b22;
        border-top: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .chat-input {
        flex: 1;
        background: #0d0e12;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 12px;
        color: #ffffff;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s;
      }

      .chat-input:focus { border-color: var(--text-active); }

      .send-btn {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
      }
      .send-btn:active { transform: scale(0.92); }
      .send-btn svg { width: 18px; height: 18px; fill: #0d0e12; }

      @media (max-width: 768px) {
        body {
          padding-top: 52px !important;
          padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
        }

        .merdex-mobile-top-bar {
          display: flex;
          position: fixed;
          top: 0; left: 0; right: 0;
          height: 48px;
          background: rgba(13, 14, 18, 0.95);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border-color);
          z-index: 9998;
          padding: 0 16px;
          align-items: center;
          justify-content: flex-start;
        }

        .merdex-mobile-top-bar .merdex-logo-container { margin-right: 0; height: 30px; }
        .merdex-mobile-top-bar .merdex-logo-img { max-width: 120px; }

        .merdex-nav-header {
          position: fixed;
          bottom: 0; left: 0; right: 0; top: auto;
          height: calc(60px + env(safe-area-inset-bottom, 0px));
          padding: 6px 12px env(safe-area-inset-bottom, 0px) 12px;
          background: var(--bg-nav);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border-top: 1px solid var(--border-color);
          border-bottom: none;
          z-index: 9999;
          justify-content: space-around;
        }

        .merdex-nav-header .merdex-logo-container { display: none; }
        .merdex-nav-links { width: 100%; justify-content: space-between; gap: 4px; }
        .merdex-nav-item { flex: 1; }
        .merdex-nav-item a {
          flex-direction: column; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; justify-content: center; border-radius: 8px; color: var(--text-inactive);
        }
        .merdex-nav-item.active a { color: var(--text-active); background: rgba(56, 189, 248, 0.08); }
        .nav-icon { display: block; }

        #custom-chat-trigger {
          bottom: calc(76px + env(safe-area-inset-bottom, 0px));
          right: 16px; width: 48px; height: 48px;
        }

        #merdex-chat-window {
          bottom: calc(65px + env(safe-area-inset-bottom, 0px));
          right: 0; left: 0;
          width: 100vw;
          height: calc(100vh - 120px);
          border-radius: 20px 20px 0 0;
        }
      }
    </style>

    <!-- 2. 中转逻辑：拦截与转发出入站消息 -->
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
      Tawk_API.lang = 'en';
      Tawk_API.autoStart = true;

      // 实时追加自定义 DOM 消息项
      function appendMessage(sender, text) {
        const msgContainer = document.getElementById('chat-messages');
        if (!msgContainer) return;

        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = text;

        const time = document.createElement('div');
        time.className = 'msg-time';
        const now = new Date();
        time.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

        row.appendChild(bubble);
        row.appendChild(time);
        msgContainer.appendChild(row);

        msgContainer.scrollTop = msgContainer.scrollHeight;
      }

      // 打开/关闭自定义面板
      function toggleCustomChat() {
        const win = document.getElementById('merdex-chat-window');
        if (win) {
          win.classList.toggle('open');
          const badge = document.getElementById('chat-unread-badge');
          if (badge) badge.classList.remove('active');
        }
      }

      // 发送消息中转逻辑
      function handleSendMessage() {
        const input = document.getElementById('chat-input-field');
        const text = input.value.trim();
        if (!text) return;

        // 1. 渲染在自研 UI 界面
        appendMessage('user', text);
        input.value = '';

        // 2. 将消息传递至 Tawk 后台通道
        if (typeof Tawk_API.addEvent === 'function') {
          Tawk_API.addEvent('UserMessage', { message: text });
        }
      }

      /* Tawk 后台事件回调处理 */
      Tawk_API.onLoad = function () {
        if (typeof Tawk_API.hideWidget === 'function') {
          Tawk_API.hideWidget();
        }
      };

      Tawk_API.onUnreadCountChanged = function(count) {
        const badge = document.getElementById('chat-unread-badge');
        if (badge && count > 0) {
          badge.classList.add('active');
        }
      };

      // 拖拽手势交互绑定
      document.addEventListener('DOMContentLoaded', function () {
        var widget = document.getElementById('custom-chat-trigger');
        if (!widget) return;

        var drag = null;
        widget.addEventListener('pointerdown', function (e) {
          var rect = widget.getBoundingClientRect();
          drag = {
            pointerId: e.pointerId, startX: e.clientX, startY: e.clientY,
            startLeft: rect.left, startTop: rect.top, moved: false
          };
          widget.setPointerCapture(e.pointerId);
          widget.classList.add('is-dragging');
        });

        widget.addEventListener('pointermove', function (e) {
          if (!drag || drag.pointerId !== e.pointerId) return;
          var dx = e.clientX - drag.startX;
          var dy = e.clientY - drag.startY;
          if (Math.hypot(dx, dy) > 5) drag.moved = true;

          var left = Math.max(10, Math.min(drag.startLeft + dx, window.innerWidth - widget.offsetWidth - 10));
          var top = Math.max(10, Math.min(drag.startTop + dy, window.innerHeight - widget.offsetHeight - 10));

          widget.style.left = left + 'px';
          widget.style.top = top + 'px';
          widget.style.right = 'auto';
          widget.style.bottom = 'auto';
        });

        widget.addEventListener('pointerup', function (e) {
          if (!drag || drag.pointerId !== e.pointerId) return;
          widget.releasePointerCapture(e.pointerId);
          widget.classList.remove('is-dragging');

          if (!drag.moved) {
            toggleCustomChat();
          }
          drag = null;
        });
      });

      // 加载官方通道
      (function () {
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/6a98b268451e133447599dcc/1k1l6h0rv';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin', '*');
        if (s0 && s0.parentNode) {
          s0.parentNode.insertBefore(s1, s0);
        } else {
          document.head.appendChild(s1);
        }
      })();
    </script>
  </head>
